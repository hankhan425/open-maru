name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install just and actionlint
        run: |
          sudo snap install just --classic
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Verify layout
        run: scripts/verify-layout
      - name: Verify toolchain pins
        run: scripts/verify-toolchain
      - name: actionlint
        run: actionlint
      - name: Script tests
        run: |
          scripts/tests/t01.test.sh
      - name: Start services
        run: just services-up
      - name: Wait for services
        run: timeout 60 scripts/wait-for-services
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: sudo snap install just --classic
      - name: Install Rust toolchain from rust-toolchain.toml
        if: hashFiles('Cargo.toml') != ''
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        if: hashFiles('Cargo.toml') != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: just check-rust
      # T03: WASM target (maru_core without `authz`) and the @openmaru/maru-wasm Node tests.
      - name: Build maru_wasm for wasm32-unknown-unknown
        if: hashFiles('Cargo.toml') != ''
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p maru_wasm --target wasm32-unknown-unknown --release
      - name: T03 script tests
        if: hashFiles('Cargo.toml') != ''
        run: scripts/tests/t03.test.sh
      - uses: taiki-e/install-action@v2
        if: hashFiles('web/packages/maru-wasm/package.json') != ''
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        if: hashFiles('web/packages/maru-wasm/package.json') != ''
        with:
          node-version-file: .tool-versions
      - name: Build @openmaru/maru-wasm
        if: hashFiles('web/packages/maru-wasm/package.json') != ''
        run: >-
          wasm-pack build crates/maru_wasm --release --target web
          --out-dir ../../web/packages/maru-wasm/pkg --out-name maru_wasm --no-pack
      - name: Test @openmaru/maru-wasm
        if: hashFiles('web/packages/maru-wasm/package.json') != ''
        working-directory: web/packages/maru-wasm
        run: node --test test/*.test.mjs

  elixir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openmaru_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/openmaru_test
      S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: sudo snap install just --classic
      - name: Create test database and start MinIO
        if: hashFiles('apps/server/mix.exs') != ''
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE openmaru_test'
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:latest
      - name: Install Rust toolchain from rust-toolchain.toml
        if: hashFiles('apps/server/mix.exs') != ''
        run: rustup show active-toolchain || rustup toolchain install
      - uses: erlef/setup-beam@v1
        if: hashFiles('apps/server/mix.exs') != ''
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        if: hashFiles('apps/server/mix.exs') != ''
        with:
          path: |
            apps/server/deps
            apps/server/_build
            apps/server/priv/plts
            target
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'apps/server/mix.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - name: Install dependencies
        if: hashFiles('apps/server/mix.exs') != ''
        run: just setup
      - run: just check-elixir
      # G01-T22: ledger throughput (ARCHITECTURE §7 target: >= 1,000 linked pairs/s).
      # Reported in the job summary, not enforced: runner speed varies.
      - name: Ledger bench
        if: hashFiles('apps/server/mix.exs') != ''
        working-directory: apps/server
        shell: bash
        run: |
          mix test --only bench | tee bench.log
          { echo '### Ledger bench (G01-T22)'; grep LEDGER_BENCH bench.log; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: sudo snap install just --classic
      - name: Read pnpm pin
        id: pins
        run: echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        if: hashFiles('web/package.json') != ''
        run: just setup
      - run: just check-web
