[package]
name = "maru_nif"
description = "Rustler NIF bindings for maru_core (and maru_token from M01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# The NIF only links inside the BEAM; it is tested through `mix test`.
test = false
doctest = false

[features]
# Exposes `panic_test/0`; enabled by `Openmaru.Lang.Native` in MIX_ENV=test only.
test-helpers = []

[dependencies]
maru_core = { path = "../maru_core" }
rustler.workspace = true

[lints]
workspace = true
