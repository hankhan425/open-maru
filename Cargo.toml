[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4.6", features = ["derive"] }
rustler = "0.38"
wasm-bindgen = "0.2"
assert_cmd = "2"
proptest = "1"
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.58", default-features = false }
# Cedar policies for `maru_core::authz` (ADR-5). 4.7 is the newest line whose MSRV fits rust-version 1.85;
# no extensions (ipaddr/decimal/datetime) are used.
cedar-policy = { version = "4.7", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
